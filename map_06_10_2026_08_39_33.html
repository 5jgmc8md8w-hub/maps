<!DOCTYPE html>
<html lang='uk'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
    <title>Карта — 06.10.2026</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'/>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .info-panel { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,.95); padding: 10px 14px; border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,.3); z-index: 1000; }
        .popup-content { font-size: 13px; line-height: 1.4; }
        .popup-content b { color: #b30000; }
        .delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; }
        .delete-btn:hover { background-color: #cc0000; }
    </style>
</head>
<body>
    <div class='info-panel'>
        <h3 style='margin:0 0 5px 0;color:#b30000;'>Загроза обстрілів</h3>
        <p style='margin:0;font-size:12px;'>Дата: <b>06.10.2026</b></p>
    </div>
    <div id='map'></div>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'></script>
    <script>
        const encodedConfig = "eyJyZXBvIjogIjVqZ21jOG1kOHctaHViL21hcHMiLCAidG9rZW4iOiAiZ2hwX3lUSVlud2hSdzJUTnY0cUY3eGVhbnk0VWw4bXNoQzJHZ0dnMyIsICJwYXNzIjogIkExNTAyMDBzcXMhIiwgImZpbGVOYW1lIjogIm1hcF8wNl8xMF8yMDI2XzA4XzM5XzMzLmh0bWwifQ==";

        var map = L.map('map', { zoomControl: false }).setView([46.681822400603885, 32.71360838052119], 10);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        setTimeout(function() {
            map.invalidateSize();
        }, 200);

        var ringPinIcon = L.divIcon({
            className: 'custom-ring-pin',
            html: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="36" height="36" style="filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.4));"><path fill="#ff1a1a" d="M256 0C153.755 0 70.844 82.911 70.844 185.156c0 102.245 142.156 288.544 170.845 322.844 3.791 4.545 10.669 4.545 14.46 0 28.689-34.3 170.845-220.599 170.845-322.844C427.156 82.911 344.245 0 256 0zm0 293.778c-59.972 0-108.622-48.65-108.622-108.622s48.65-108.622 108.622-108.622 108.622 48.65 108.622 108.622-48.65 108.622-108.622 108.622z"/></svg>',
            iconSize: [36, 36],
            iconAnchor: [18, 36],
            popupAnchor: [0, -36]
        });

        var rawData = [[46.681822400603885,32.71360838052119,"Точка 1","• газорозподільча підстанція в районі н.п. АНТОНІВКА (36T VS 78098 69847);"],[46.671429174900105,32.6582183591472,"Точка 2","військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (36T VS 73857 68709; 36T VS 76621 70202; 36T VS 81516 69250); БІЛОЗЕРКА (36T VS 57519 63541; 36T VS 58249 64806); КОМИШАНИ (36T VS 61794 65189); ХЕРСОН (36T VS 70807 66327; 36T VS 71143 67011; 36T VS 71608 67110; 36T VS 71753 66760);"],[46.662773164633606,32.49757223127877,"Точка 3","• вогневі позиції СОУ в районі н.п. КОМИШАНИ (36T VS 61563 67813); КРУТИЙ ЯР (36T VS 59472 76810); ХЕРСОН (36T VS 67613 66868); ШЕВЧЕНКІВКА (36T WT 62564 44217);"],[46.675888624542274,32.688261884623124,"Точка 4","• ПТД особового складу СОУ в районі н.п. АНТОНІВКА (36T VS 76157 69195; 36T VS 79239 69752); БЕРИСЛАВ (36T WS 30310 86592); БІЛОЗЕРКА (36T VS 57315 63767); ВИСОКЕ (36T WS 07411 92755); ДАР'ЇВКА (36T VS 83675 78346; 36T VS 86006 77810); ДНІПРОВСЬКЕ (36T VS 58948 59987; 36T VS 58978 58719; 36T VS 59050 59777; 36T VS 59333 59862);"]];

        var markersList = [];
        function renderMarkers() {
            markersList.forEach(function(mObj) { map.removeLayer(mObj.marker); });
            markersList = [];
            rawData.forEach(function(item, index) {
                var marker = L.marker([item[0], item[1]], { icon: ringPinIcon }).addTo(map);
                var popupContent = '<div class="popup-content">' + 
                    '<b>' + item[2] + '</b><br>' +
                    'Координати: ' + item[3] + '<br>' +
                    '<button class="delete-btn" onclick="deletePoint(' + index + ')">🗑️ Видалити точку</button>' +
                    '</div>';
                marker.bindPopup(popupContent);
                markersList.push({ index: index, marker: marker });
            });
        }

        async function deletePoint(index) {
            let decoded = JSON.parse(atob(encodedConfig));
            let inputPass = prompt("Введіть пароль адміністратора для видалення точки з карти:");
            if (inputPass === null) return;

            if (inputPass !== decoded.pass) {
                alert("Невірний пароль!");
                return;
            }

            if (!confirm("Видалити цю точку назавжди для всіх користувачів?")) return;

            rawData.splice(index, 1);
            map.closePopup();
            renderMarkers();

            let apiUrl = 'https://api.github.com/repos/' + decoded.repo + '/contents/' + decoded.fileName;
            try {
                let getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': 'Bearer ' + decoded.token, 'Accept': 'application/vnd.github+json' }
                });
                let fileData = await getRes.json();
                let sha = fileData.sha;

                let currentHtml = new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0)));
                
                let oldRawDataMatch = currentHtml.match(/var rawData = \[[\s\S]*?\];/);
                if (!oldRawDataMatch) {
                    alert('Помилка: не вдалося знайти масив даних у файлі.');
                    return;
                }
                
                let newRawDataStr = 'var rawData = ' + JSON.stringify(rawData) + ';';
                let updatedHtml = currentHtml.replace(oldRawDataMatch[0], newRawDataStr);
                
                let encodedContent = btoa(unescape(encodeURIComponent(updatedHtml)));

                let putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + decoded.token,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Delete marker and update map',                        content: encodedContent,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert("Точку успішно видалено на GitHub! Сторінка оновлюється.");
                    location.reload();
                } else {
                    let errJson = await putRes.json();
                    alert('Помилка збереження: ' + (errJson.message || putRes.statusText));
                }
            } catch (err) {
                alert('Помилка мережі: ' + err.message);
            }
        }

        renderMarkers();
    </script>
</body>
</html>
