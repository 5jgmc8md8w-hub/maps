<!DOCTYPE html>
<html lang='uk'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
    <title>Карта — 06.10.2026</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'/>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .info-panel { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,.95); padding: 10px 14px; border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,.3); z-index: 1000; }
        .control-panel {
            position: absolute; top: 15px; right: 15px; width: 300px; max-height: calc(100vh - 30px);
            background: rgba(255,255,255,0.97); padding: 12px; border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0,0,0,.3); z-index: 1000;
            display: flex; flex-direction: column; box-sizing: border-box;
        }
        .control-panel h4 { margin: 0 0 8px 0; color: #b30000; font-size: 14px; }
        .points-list {
            overflow-y: auto; flex-grow: 1; max-height: 250px; border: 1px solid #ddd;
            padding: 6px; border-radius: 4px; background: #fafafa; margin-bottom: 8px;
        }
        .point-item { display: flex; align-items: center; font-size: 12px; margin-bottom: 5px; cursor: pointer; }
        .point-item input { margin-right: 6px; }
        .point-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .panel-btns { display: flex; gap: 6px; margin-bottom: 6px; }
        .panel-btns button {
            flex: 1; padding: 5px; font-size: 11px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;
        }
        .btn-select-all { background-color: #e0e0e0; color: #333; }
        .btn-select-all:hover { background-color: #d0d0d0; }
        .delete-selected-btn {
            background-color: #ff4d4d; color: white; border: none; padding: 8px;
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 12px;
        }
        .delete-selected-btn:hover { background-color: #cc0000; }
        .popup-content { font-size: 13px; line-height: 1.4; }
        .popup-content b { color: #b30000; }
        .popup-zoom-btn { background-color: #007bff; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 6px; width: 100%; }
        .popup-zoom-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class='info-panel'>
        <h3 style='margin:0 0 5px 0;color:#b30000;'>Загроза обстрілів</h3>
        <p style='margin:0;font-size:12px;'>Дата: <b>06.10.2026</b></p>
    </div>

    <div class='control-panel'>
        <h4>Керування точками</h4>
        <div class='points-list' id='pointsListContainer'></div>
        <div class='panel-btns'>
            <button class='btn-select-all' onclick='toggleSelectAll()'>Вибрати все</button>
        </div>
        <button class='delete-selected-btn' onclick='deleteSelectedPoints()'>🗑️ Видалити вибрані</button>
    </div>

    <div id='map'></div>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'></script>
    <script>
        const encodedConfig = "eyJyZXBvIjogIjVqZ21jOG1kOHctaHViL21hcHMiLCAidG9rZW4iOiAiZ2hwX3lUSVlud2hSdzJUTnY0cUY3eGVhbnk0VWw4bXNoQzJHZ0dnMyIsICJwYXNzIjogIkExNTAyMDBzcXMhIiwgImZpbGVOYW1lIjogIm1hcF8wNl8xMF8yMDI2XzE3XzU2XzAwLmh0bWwifQ==";

        var map = L.map('map', { zoomControl: false }).setView([46.681822400603885, 32.71360838052119], 10);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        setTimeout(function() {
            map.invalidateSize();
        }, 200);

        var ringPinIcon = L.divIcon({
            className: 'custom-ring-pin',
            html: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="36" height="36" style="filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.4));"><path fill="#ff1a1a" d="M256 0C153.755 0 70.844 82.911 70.844 185.156c0 102.245 142.156 288.544 170.845 322.844 3.791 4.545 10.669 4.545 14.46 0 28.689-34.3 170.845-220.599 170.845-322.844C427.156 82.911 344.245 0 256 0zm0 293.778c-59.972 0-108.622-48.65-108.622-108.622s48.65-108.622 108.622-108.622 108.622 48.65 108.622 108.622-48.65 108.622-108.622 108.622z"/></svg>',
            iconSize: [36, 36],
            iconAnchor: [18, 36],
            popupAnchor: [0, -36]
        });

        var rawData = [[46.681822400603885,32.71360838052119,"газорозподільча підстанція в районі н.п. АНТОНІВКА (","36T VS 78098 69847"],[46.671429174900105,32.6582183591472,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 73857 68709"],[46.684967125897806,32.69427730700208,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 76621 70202"],[46.67655301726215,32.758325827253906,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 81516 69250"],[46.62408552553067,32.44510686214968,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 57519 63541"],[46.63551503299752,32.45452743455385,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 58249 64806"],[46.63917307811406,32.500808927569025,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 61794 65189"],[46.649867267903524,32.618495714840755,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 70807 66327"],[46.656037220227894,32.62284379323501,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 71143 67011"],[46.65694800414666,32.62891504055368,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 71608 67110"],[46.6538044423182,32.630831592948155,"військова техніка СОУ / бронетехніка СОУ в районі н.п. АНТОНІВКА (","36T VS 71753 66760"],[46.662773164633606,32.49757223127877,"вогневі позиції СОУ в районі н.п. КОМИШАНИ (","36T VS 61563 67813"],[46.74361251158922,32.469448396642626,"вогневі позиції СОУ в районі н.п. КОМИШАНИ (","36T VS 59472 76810"],[46.654588977295994,32.57671853405952,"вогневі позиції СОУ в районі н.п. КОМИШАНИ (","36T VS 67613 66868"],[47.34842378262864,33.82833618434281,"вогневі позиції СОУ в районі н.п. КОМИШАНИ (","36T WT 62564 44217"],[46.675888624542274,32.688261884623124,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 76157 69195"],[46.68100384893473,32.72853225862991,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 79239 69752"],[46.83218152739805,33.39743910618351,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T WS 30310 86592"],[46.62610632921846,32.44242143080823,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 57315 63767"],[46.888290922907686,33.09727779109968,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T WS 07411 92755"],[46.75846540095073,32.78623103877922,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 83675 78346"],[46.75369482485944,32.816770674095224,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 86006 77810"],[46.59219212504434,32.46408735124555,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 58948 59987"],[46.580783197023415,32.464591330041735,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 58978 58719"],[46.590308561051856,32.465437430243504,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 59050 59777"],[46.59109068001576,32.46912409015746,"ПТД особового складу СОУ в районі н.п. АНТОНІВКА (","36T VS 59333 59862"]];

        var markersList = [];
        
        function renderMarkers() {
            markersList.forEach(function(mObj) { map.removeLayer(mObj.marker); });
            markersList = [];
            
            let listContainer = document.getElementById('pointsListContainer');
            listContainer.innerHTML = '';
            
            rawData.forEach(function(item, index) {
                var marker = L.marker([item[0], item[1]], { icon: ringPinIcon }).addTo(map);
                var popupContent = '<div class="popup-content">' + 
                    '<b>' + item[2] + '</b><br>' +
                    'MGRS: ' + item[3] + '<br>' +
                    '<button class="popup-zoom-btn" onclick="zoomToPoint(' + item[0] + ', ' + item[1] + ')">📍 Центрувати</button>' +
                    '</div>';
                marker.bindPopup(popupContent);
                markersList.push({ index: index, marker: marker });
                
                let div = document.createElement('div');
                div.className = 'point-item';
                div.innerHTML = '<input type="checkbox" data-index="' + index + '"><span title="' + item[2] + ' (' + item[3] + ')">' + (index + 1) + '. ' + item[2] + ' (' + item[3] + ')</span>';
                
                div.querySelector('span').onclick = function() {
                    map.setView([item[0], item[1]], 14);
                    marker.openPopup();
                };
                
                listContainer.appendChild(div);
            });
        }

        function zoomToPoint(lat, lon) {
            map.setView([lat, lon], 15);
            map.closePopup();
        }

        function toggleSelectAll() {
            let checkboxes = document.querySelectorAll('.points-list input[type="checkbox"]');
            let allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        async function deleteSelectedPoints() {
            let checkboxes = document.querySelectorAll('.points-list input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                alert('Виберіть хоча б одну точку для видалення!');
                return;
            }

            let decoded = JSON.parse(atob(encodedConfig));
            let inputPass = prompt("Введіть пароль адміністратора для видалення вибраних точок:");
            if (inputPass === null) return;

            if (inputPass !== decoded.pass) {
                alert("Невірний пароль!");
                return;
            }

            if (!confirm("Видалити вибрані точки (" + checkboxes.length + " шт.) назавжди для всіх користувачів?")) return;

            let indicesToRemove = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-index'))).sort((a, b) => b - a);
            
            indicesToRemove.forEach(index => {
                rawData.splice(index, 1);
            });
            
            map.closePopup();
            renderMarkers();

            let apiUrl = 'https://api.github.com/repos/' + decoded.repo + '/contents/' + decoded.fileName;
            try {
                let getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': 'Bearer ' + decoded.token, 'Accept': 'application/vnd.github+json' }
                });
                let fileData = await getRes.json();
                let sha = fileData.sha;

                let currentHtml = new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0)));
                
                let oldRawDataMatch = currentHtml.match(/var rawData = \[([\s\S]*?)\];/);
                if (!oldRawDataMatch) {
                    alert('Помилка: не вдалося знайти масив даних у файлі.');
                    return;
                }
                
                let newRawDataStr = 'var rawData = ' + JSON.stringify(rawData) + ';';
                let updatedHtml = currentHtml.replace(oldRawDataMatch[0], newRawDataStr);
                
                let encodedContent = btoa(unescape(encodeURIComponent(updatedHtml)));

                let putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + decoded.token,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Delete multiple markers and update map',
                        content: encodedContent,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert("Вибрані точки успішно видалено на GitHub! Сторінка оновлюється.");
                    location.reload();
                } else {
                    let errJson = await putRes.json();
                    alert('Помилка збереження: ' + (errJson.message || putRes.statusText));
                }
            } catch (err) {
                alert('Помилка мережі: ' + err.message);
            }
        }

        renderMarkers();
    </script>
</body>
</html>
