var markersList = [];

function renderMarkers() {
    markersList.forEach(function(mObj){map.removeLayer(mObj.marker);});
    markersList=[];
    let listContainer=document.getElementById('pointsListContainer');
    listContainer.innerHTML='';
    rawData.forEach(function(item,index){
        var marker=L.marker([item[0],item[1]], {icon: customIcon}).addTo(map);
        
        let popupHtml = '<div class="popup-content"><b>'+item[2]+'</b><br>MGRS: '+item[3]+'<br>' +
                        '<button class="select-point-btn" onclick="selectPointFromMap('+index+')">Вибрати точку</button></div>';
        marker.bindPopup(popupHtml);
        
        markersList.push({index:index,marker:marker});
        
        let div=document.createElement('div');
        div.className='point-item';
        div.innerHTML='<input type="checkbox" data-index="'+index+'" id="chk_'+index+'"><span>'+(index+1)+'. '+item[2]+'</span>';
        listContainer.appendChild(div);
    });
}

function togglePanel() {
    let panel=document.getElementById('controlPanel');
    let lockBtn=document.getElementById('lockBtn');
    if(!isAuthenticated) {
        let decoded=JSON.parse(atob(encodedConfig));
        let inputPass=prompt('Введіть пароль адміністратора:');
        if(inputPass!==decoded.pass) {alert('Невірний пароль!');return;}
        isAuthenticated=true;
        lockBtn.innerHTML='🔓';
    }
    panel.classList.toggle('active');
}

function selectPointFromMap(index) {
    if(!isAuthenticated) {
        let decoded=JSON.parse(atob(encodedConfig));
        let inputPass=prompt('Введіть пароль адміністратора для керування точками:');
        if(inputPass!==decoded.pass) {alert('Невірний пароль!');return;}
        isAuthenticated=true;
        document.getElementById('lockBtn').innerHTML='🔓';
        document.getElementById('controlPanel').classList.add('active');
    }
    document.querySelectorAll('.points-list input[type="checkbox"]').forEach(cb => cb.checked = false);
    let targetCheckbox = document.getElementById('chk_' + index);
    if(targetCheckbox) {
        targetCheckbox.checked = true;
        targetCheckbox.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }
    markersList[index].marker.openPopup();
}

function startDeleteCountdown() {
    let checkboxes=document.querySelectorAll('.points-list input[type="checkbox"]:checked');
    if(checkboxes.length===0) {alert('Виберіть точки у списку!');return;}
    if(!confirm('Видалити вибрані точки?')) return;

    let timerDiv = document.getElementById('deleteTimerText');
    let secondsLeft = 60;
    
    let interval = setInterval(function() {
        timerDiv.innerText = 'Видалення та оновлення через ' + secondsLeft + 'с...';
        secondsLeft--;
        if(secondsLeft < 0) {
            clearInterval(interval);
            timerDiv.innerText = '';
            executeDelete();
        }
    }, 1000);
}

async function executeDelete() {
    let checkboxes=document.querySelectorAll('.points-list input[type="checkbox"]:checked');
    let decoded=JSON.parse(atob(encodedConfig));
    let indicesToRemove=Array.from(checkboxes).map(cb=>parseInt(cb.getAttribute('data-index'))).sort((a,b)=>b-a);
    indicesToRemove.forEach(index=>rawData.splice(index,1));
    renderMarkers();
    
    let apiUrl='https://api.github.com/repos/'+decoded.repo+'/contents/'+decoded.fileName;
    try {
        let getRes=await fetch(apiUrl,{headers:{'Authorization':'Bearer '+decoded.token}});
        let fileData=await getRes.json();
        let currentHtml=atob(fileData.content.replace(/\n/g,''));
        let newRawDataStr='var rawData = '+JSON.stringify(rawData)+';\n';
        let updatedHtml=currentHtml.replace(/var rawData = [\s\S]*?;\n/, newRawDataStr);
        let putRes=await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'Bearer '+decoded.token,'Content-Type':'application/json'},body:JSON.stringify({message:'Update markers',content:btoa(unescape(encodeURIComponent(updatedHtml))),sha:fileData.sha})});
        if(putRes.ok) location.reload();
    } catch(err) { alert('Помилка: '+err.message); }
}
renderMarkers();
