</head>
<body>

    </div>
    <div id='map'></div>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'></script>
    <script>
        const encodedConfig = "eyJyZXBvIjogIjVqZ21jOG1kOHctaHViL21hcHMiLCAidG9rZW4iOiAiZ2hwX3lUSVlud2hSdzJUTnY0cUY3eGVhbnk0VWw4bXNoQzJHZ0dnMyIsICJwYXNzIjogIkExNTAyMDBzcXMhIiwgImZpbGVOYW1lIjogIm1hcF8wNl8xMF8yMDI2XzA4XzQyXzQ2Lmh0bWwifQ==";

        var map = L.map('map', { zoomControl: false }).setView([46.681822400603885, 32.71360838052119], 10);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        setTimeout(function() {
            map.invalidateSize();
        }, 200);

        var ringPinIcon = L.divIcon({
            className: 'custom-ring-pin',
            html: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="36" height="36" style="filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.4));"><path fill="#ff1a1a" d="M256 0C153.755 0 70.844 82.911 70.844 185.156c0 102.245 142.156 288.544 170.845 322.844 3.791 4.545 10.669 4.545 14.46 0 28.689-34.3 170.845-220.599 170.845-322.844C427.156 82.911 344.245 0 256 0zm0 293.778c-59.972 0-108.622-48.65-108.622-108.622s48.65-108.622 108.622-108.622 108.622 48.65 108.622 108.622-48.65 108.622-108.622 108.622z"/></svg>',
            iconSize: [36, 36],
            iconAnchor: [18, 36],
            popupAnchor: [0, -36]
        });

        var rawData = [[46.681822400603885,32.71360838052119,"Точка 1","газорозподільча підстанція (АНТОНІВКА),36T VS 78098 69847,,"],[46.671429174900105,32.6582183591472,"Точка 2","військова техніка / бронетехніка (АНТОНІВКА),36T VS 73857 68709,,"],[46.684967125897806,32.69427730700208,"Точка 3","військова техніка / бронетехніка (АНТОНІВКА),36T VS 76621 70202,,"],[46.67655301726215,32.758325827253906,"Точка 4","військова техніка / бронетехніка (АНТОНІВКА),36T VS 81516 69250,,"],[46.62408552553067,32.44510686214968,"Точка 5","військова техніка / бронетехніка (БІЛОЗЕРКА),36T VS 57519 63541,,"],[46.63551503299752,32.45452743455385,"Точка 6","військова техніка / бронетехніка (БІЛОЗЕРКА),36T VS 58249 64806,,"],[46.63917307811406,32.500808927569025,"Точка 7","військова техніка / бронетехніка (КОМИШАНИ),36T VS 61794 65189,,"],[46.649867267903524,32.618495714840755,"Точка 8","військова техніка / бронетехніка (ХЕРСОН),36T VS 70807 66327,,"],[46.656037220227894,32.62284379323501,"Точка 9","військова техніка / бронетехніка (ХЕРСОН),36T VS 71143 67011,,"],[46.65694800414666,32.62891504055368,"Точка 10","військова техніка / бронетехніка (ХЕРСОН),36T VS 71608 67110,,"],[46.6538044423182,32.630831592948155,"Точка 11","військова техніка / бронетехніка (ХЕРСОН),36T VS 71753 66760,,"],[46.662773164633606,32.49757223127877,"Точка 12","вогневі позиції (КОМИШАНИ),36T VS 61563 67813,,"],[46.74361251158922,32.469448396642626,"Точка 13","вогневі позиції (КРУТИЙ ЯР),36T VS 59472 76810,,"],[46.654588977295994,32.57671853405952,"Точка 14","вогневі позиції (ХЕРСОН),36T VS 67613 66868,,"],[47.34842378262864,33.82833618434281,"Точка 15","вогневі позиції (ШЕВЧЕНКІВКА),36T WT 62564 44217,,"],[46.675888624542274,32.688261884623124,"Точка 16","ПТД особового складу (АНТОНІВКА),36T VS 76157 69195,,"],[46.68100384893473,32.72853225862991,"Точка 17","ПТД особового складу (АНТОНІВКА),36T VS 79239 69752,,"],[46.83218152739805,33.39743910618351,"Точка 18","ПТД особового складу (БЕРИСЛАВ),36T WS 30310 86592,,"],[46.62610632921846,32.44242143080823,"Точка 19","ПТД особового складу (БІЛОЗЕРКА),36T VS 57315 63767,,"],[46.888290922907686,33.09727779109968,"Точка 20","ПТД особового складу (ВИСОКЕ),36T WS 07411 92755,,"],[46.75846540095073,32.78623103877922,"Точка 21","ПТД особового складу (ДАР'ЇВКА),36T VS 83675 78346,,"],[46.75369482485944,32.816770674095224,"Точка 22","ПТД особового складу (ДАР'ЇВКА),36T VS 86006 77810,,"],[46.59219212504434,32.46408735124555,"Точка 23","ПТД особового складу (ДНІПРОВСЬКЕ),36T VS 58948 59987,,"],[46.580783197023415,32.464591330041735,"Точка 24","ПТД особового складу (ДНІПРОВСЬКЕ),36T VS 58978 58719,,"],[46.590308561051856,32.465437430243504,"Точка 25","ПТД особового складу (ДНІПРОВСЬКЕ),36T VS 59050 59777,,"],[46.59109068001576,32.46912409015746,"Точка 26","ПТД особового складу (ДНІПРОВСЬКЕ),36T VS 59333 59862,,"]];

        var markersList = [];
        function renderMarkers() {
            markersList.forEach(function(mObj) { map.removeLayer(mObj.marker); });
            markersList = [];
            rawData.forEach(function(item, index) {
                var marker = L.marker([item[0], item[1]], { icon: ringPinIcon }).addTo(map);
                var popupContent = '<div class="popup-content">' + 
                    '<b>' + item[2] + '</b><br>' +
                    'Координати: ' + item[3] + '<br>' +
                    '<button class="delete-btn" onclick="deletePoint(' + index + ')">🗑️ Видалити точку</button>' +
                    '</div>';
                marker.bindPopup(popupContent);
                markersList.push({ index: index, marker: marker });
            });
        }

        async function deletePoint(index) {
            let decoded = JSON.parse(atob(encodedConfig));
            let inputPass = prompt("Введіть пароль адміністратора для видалення точки з карти:");
            if (inputPass === null) return;

            if (inputPass !== decoded.pass) {
                alert("Невірний пароль!");
                return;
            }

            if (!confirm("Видалити цю точку назавжди для всіх користувачів?")) return;

            rawData.splice(index, 1);
            map.closePopup();
            renderMarkers();

            let apiUrl = 'https://api.github.com/repos/' + decoded.repo + '/contents/' + decoded.fileName;
            try {
                let getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': 'Bearer ' + decoded.token, 'Accept': 'application/vnd.github+json' }
                });
                let fileData = await getRes.json();
                let sha = fileData.sha;

                let currentHtml = new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0)));
                
                let oldRawDataMatch = currentHtml.match(/var rawData = \[[\s\S]*?\];/);
                if (!oldRawDataMatch) {
                    alert('Помилка: не вдалося знайти масив даних у файлі.');
                    return;
                }
                
                let newRawDataStr = 'var rawData = ' + JSON.stringify(rawData) + ';';
                let updatedHtml = currentHtml.replace(oldRawDataMatch[0], newRawDataStr);
                
                let encodedContent = btoa(unescape(encodeURIComponent(updatedHtml)));

                let putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + decoded.token,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Delete marker and update map',                        content: encodedContent,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert("Точку успішно видалено на GitHub! Сторінка оновлюється.");
                    location.reload();
                } else {
                    let errJson = await putRes.json();
                    alert('Помилка збереження: ' + (errJson.message || putRes.statusText));
                }
            } catch (err) {
                alert('Помилка мережі: ' + err.message);
            }
        }

        renderMarkers();
    </script>
</body>
</html>
